<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Catálogo | MUVI Collection</title>

    <link rel="stylesheet"
        href="css/styles.css">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body class="catalog-page">


<header class="header">

    <div class="header-inner">

        <a href="index.html" class="brand">

            <img src="assets/logo.jpeg">

        </a>


        <nav class="navigation">

            <a href="index.html">
                Inicio
            </a>

            <a href="catalogo.html"
                class="active">

                Catálogo

            </a>

            <a href="personalizador.html">

                Personaliza

            </a>

            <a href="index.html#nosotros">

                Nosotros

            </a>

        </nav>


        <div class="header-actions">

            <a href="personalizador.html"
                class="design-button">

                <i class="fa-solid fa-wand-magic-sparkles"></i>

                Diseñar

            </a>


            <a href="carrito.html"
                class="cart-button">

                <i class="fa-solid fa-bag-shopping"></i>

                <span id="cartCount">
                    0
                </span>

            </a>

        </div>

    </div>

</header>


<main>


<section class="catalog-hero">

    <span class="eyebrow">
        MUVI COLLECTION
    </span>

    <h1>
        Nuestro catálogo
    </h1>

    <p>
        Elige tu producto y dale tu propio estilo.
    </p>

</section>


<div class="filters"><button class="filter-btn active" data-filter="todos">Todos</button><button class="filter-btn" data-filter="camisetas">Camisetas</button><button class="filter-btn" data-filter="gorras">Gorras</button><button class="filter-btn" data-filter="tazas">Tazas</button><button class="filter-btn" data-filter="llaveros">Llaveros</button><button class="filter-btn" data-filter="termos">Termos</button><button class="filter-btn" data-filter="hogar">Hogar y oficina</button></div>


<section class="product-grid" id="productGrid"></section>


</main>


<script src="js/app.js"></script>

<script src="js/catalogo.js"></script>


</body>

</html>
